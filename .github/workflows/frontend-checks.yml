name: Academy frontend checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check services/academy-api.js
          node --check services/course-alerts.js
          node --check pages/my-courses.js
          node --check components/icons.js
          node --check service-worker.js
      - name: Run Academy API regression tests
        run: node --experimental-default-type=module --test tests/*.test.mjs
